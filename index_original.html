<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コンプライアンス研修</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main id="app">
    <section id="stage" aria-label="研修シナリオ画面">
      <div id="locationBadge">開始前</div>
      <aside id="trainingPanel">
        <div class="panelTop">
          <span id="progressText">開始前</span>
          <span id="modeBadge">ケーススタディ</span>
        </div>
        <h1>コンプライアンス研修</h1>
        <div id="chapter">日常業務の判断を確認しましょう</div>
        <p id="question">開始ボタンを押すと、10本のシナリオが順番に表示されます。各場面で望ましい対応を選び、解説を読みながら理解を深めてください。</p>
        <div id="choices"></div>
        <button id="startBtn" type="button">研修を開始する</button>
      </aside>

      <article id="readingPanel" aria-live="polite">
        <div class="readingHead">読み物・解説</div>
        <div id="readingText">選択後に、その場面で考えるポイントを表示します。</div>
      </article>

      <div id="messageBubble" aria-live="polite">
        <img id="bubbleIcon" src="assets/ui/info.png" alt="" />
        <span>迷ったときほど、患者・職員・組織の信頼を守る行動を選びましょう。</span>
      </div>

      <img id="charLeft" class="character pos-left" alt="登場人物 左" />
      <img id="charCenter" class="character pos-center" alt="登場人物 中央" />
      <img id="charRight" class="character pos-right" alt="登場人物 右" />
      <div id="judgement" aria-hidden="true"></div>
    </section>
  </main>
  <script src="assets/main.js"></script>
</body>
</html>
