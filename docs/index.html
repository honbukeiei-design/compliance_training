<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンプライアンス研修</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="app">
    <section id="stage">
      <div id="locationBadge">ナースステーション</div>

      <div id="trainingPanel">
        <h1>コンプライアンス研修</h1>
        <div id="progressText">開始前</div>
        <div id="chapter">研修開始</div>
        <p id="question">「研修開始」を押すと、全シナリオを順番に体験します。</p>

        <div id="choices"></div>

        <button id="startBtn" onclick="startTraining()">研修開始</button>
      </div>

      <div id="messageBubble">
        <img src="assets/icons/info.png" alt="">
        <span>研修開始後、選択肢を選ぶと自動で次の場面へ進みます。</span>
      </div>

      <img id="charLeft" class="character pos-left" alt="">
      <img id="charCenter" class="character pos-center" alt="">
      <img id="charRight" class="character pos-right" alt="">

      <div id="judgement"></div>
    </section>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
